name: fiqh_learning_app
description: تطبيق التعليم الفقهي - تطبيق أندرويد متصل بموقع التعليم الفقهي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # HTTP & API
  http: ^1.2.2

  # Storage
  shared_preferences: ^2.3.2

  # Video Player
  youtube_player_flutter: ^9.1.1
  video_player: ^2.9.2

  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
