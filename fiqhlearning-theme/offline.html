<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>غير متصل - مدرسة الريحان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f7fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            text-align: center;
            padding: 20px;
        }

        .offline-container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #2C5F2D 0%, #4CAF50 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        .offline-icon svg {
            width: 60px;
            height: 60px;
            color: white;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(44, 95, 45, 0.7);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(44, 95, 45, 0);
            }
        }

        h1 {
            color: #2C5F2D;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #2C5F2D 0%, #4CAF50 100%);
            color: white;
            padding: 0.875rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(44, 95, 45, 0.3);
        }

        .offline-features {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }

        .offline-features h3 {
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .cached-pages {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .cached-pages a {
            color: #2C5F2D;
            text-decoration: none;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .cached-pages a:hover {
            background: #f0fdf4;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path>
            </svg>
        </div>

        <h1>غير متصل بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالإنترنت حالياً. يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى.</p>

        <button onclick="window.location.reload()" class="btn">
            إعادة المحاولة
        </button>

        <div class="offline-features">
            <h3>بعض الصفحات المحفوظة متاحة للعرض:</h3>
            <div class="cached-pages">
                <a href="/">الصفحة الرئيسية</a>
                <a href="/courses">المقررات</a>
                <a href="/student-dashboard">لوحة الطالب</a>
            </div>
        </div>
    </div>

    <script>
        // محاولة إعادة الاتصال تلقائياً كل 30 ثانية
        setInterval(function() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 30000);

        // إعادة التحميل عند استعادة الاتصال
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
